target: target_next_5m_return

train_fraction: 0.70
validation_fraction: 0.15
test_fraction: 0.15

purge_gap: 1

models:
  - zero
  - ridge
  - lasso
  - xgboost

ridge_alpha: 1.0
lasso_alpha: 0.0001

xgboost:
  n_estimators: 300
  max_depth: 3
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42